base_model: "openai/whisper-large-v3"
language: "urdu"
task: "transcribe"

manifest_path: "D:/Audion-Data/Urdu/open_datasets/manifest_opendata.jsonl"
train_split: "train"
eval_split: "validation"
sample_rate: 16000

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training:
  output_dir: "D:/Audion-Data/Urdu/checkpoints/stt_v2_lora"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-3
  warmup_steps: 50
  num_train_epochs: 3
  bf16: true
  eval_strategy: "steps"
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  logging_steps: 25
  generation_max_length: 225
  predict_with_generate: true
