# Same hyperparameters as day3_lora.yaml, pointed at the combined FLEURS + podcast
# manifest and a separate output_dir. Kept as its own file so the FLEURS-only run
# (day3_lora.yaml, test split 20.65% WER / 6.79% CER) stays reproducible for comparison.
base_model: "openai/whisper-large-v3"
language: "urdu"
task: "transcribe"

manifest_path: "D:/Audion-Data/Urdu/open_datasets/manifest_combined.jsonl"
train_split: "train"
eval_split: "validation"
sample_rate: 16000

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["q_proj", "v_proj"]

training:
  output_dir: "D:/Audion-Data/Urdu/checkpoints/stt_v2_lora_combined"
  # 4/4 rather than day3_lora.yaml's 8/2 -- same effective batch (16), half the peak
  # memory. The podcast transcripts are far longer than FLEURS's short read-aloud
  # sentences, so the collator pads labels to a much greater length and decoder
  # activations grow accordingly. At batch 8 this run hit 32039/32607 MiB (98%) with
  # step time already climbing 1.66 -> 2.29 s/it: the same allocator-thrashing pattern
  # that preceded earlier crashes. Caught and stopped at step 65.
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 50
  num_train_epochs: 3
  bf16: true
  eval_strategy: "steps"
  eval_steps: 100
  save_steps: 100
  save_total_limit: 5
  logging_steps: 25
